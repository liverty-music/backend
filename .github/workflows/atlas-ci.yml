name: Atlas CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgres://postgres:password@localhost:15432/postgres?sslmode=disable"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            src:
              - 'k8s/atlas/base/migrations/**'
              - 'k8s/atlas/base/kustomization.yaml'
              - 'scripts/check-migration-drift.sh'
              - 'internal/infrastructure/database/rdb/model.go'
              - 'atlas.hcl'
              - '.github/workflows/**'

  atlas-ci:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0

      - name: Check Migration Ordering
        run: bash scripts/check-migration-drift.sh --check-ordering

      - name: Atlas Migrate Validate
        run: |
          atlas migrate validate \
            --dev-url "${{ env.DATABASE_URL }}" \
            --dir "file://k8s/atlas/base/migrations"

  atlas-ci-skip:
    needs: changes
    if: needs.changes.outputs.src == 'false'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping Atlas CI"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, atlas-ci, atlas-ci-skip]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: atlas-ci, atlas-ci-skip
          jobs: ${{ toJSON(needs) }}
