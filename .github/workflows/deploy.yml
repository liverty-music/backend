name: Deploy Backend

# Dual trigger:
#  - push to main      -> dev AR (liverty-music-dev/backend). Every push to
#                         main runs this workflow (no paths: trigger gate).
#                         One job (`build-dev-images`) decides "build vs
#                         inherit" over the pushed range (event.before..sha):
#                           * build:   one Bake run (docker-bake.hcl) builds
#                                      all 10 images (api, consumer, identity,
#                                      worker, concert-discovery, artist-image-sync,
#                                      official-site-refresh,
#                                      sales-phase-discovery, sales-reminders,
#                                      series-image-consumer), pushing
#                                      :latest, :main, :<sha>.
#                           * inherit: no rebuild — crane-copy each parent
#                                      push tip's dev digest onto :<sha> (and
#                                      re-point :main, :latest). Used when the
#                                      push changed no build-relevant file
#                                      (CI config / docs only).
#  - release published -> retag dev AR digest into prod AR
#                         (liverty-music-prod/backend). 9× `crane copy`
#                         across the matrix — no rebuild. Each matrix
#                         entry resolves its own dev AR digest for
#                         github.sha and promotes that exact digest to
#                         prod AR under :<release-tag> and :<sha>.
#
# Per OpenSpec change `backend-symmetric-retag` (extending the
# frontend `promote-prod-image-via-retag` archive to the backend's
# multi-image matrix), the release path stops invoking `docker build`. The
# prod image deployed is byte-identical to the dev image already
# exercised under the same `:<sha>` tag. This trims ~6 min of redundant
# rebuild per release event (4× ~90 s sequential build-push) down to
# ~30 s of parallel digest-resolve + crane copy.
#
# Per OpenSpec change `guarantee-dev-image-per-main-commit`, the `paths:`
# trigger gate was removed so EVERY main commit gets a resolvable dev
# `:<sha>` image (by build or by parent-digest inheritance). This makes
# "any main commit is releasable" a true invariant: a release cut on main
# HEAD always resolves a dev image, regardless of what the HEAD commit
# touched. The former glob set now drives the in-workflow build-vs-inherit
# decision instead of gating the trigger.
on:
  push:
    branches:
      - main
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =====================================================================
  # Push path: every dev image in ONE job
  # =====================================================================
  # One job builds all images with Bake (docker-bake.hcl), or inherits the
  # parent push tip's digests when nothing build-relevant changed. Before,
  # each image was a matrix job of its own: eight checkouts, eight GCP logins
  # and eight compiles of the same shared packages, ~35-40 billed minutes per
  # push for ~5 minutes of wall time. The Dockerfile builds the seven
  # CGO-free binaries in one `build-static` stage, and Bake builds that stage
  # once for all of them.
  build-dev-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: dev
    permissions:
      contents: read
      id-token: write
    env:
      REGION: ${{ vars.REGION }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}
      # The images of docker-bake.hcl, and of the release matrix below. The
      # inherit path copies exactly these.
      IMAGES: api consumer identity worker concert-discovery artist-image-sync official-site-refresh sales-phase-discovery sales-reminders series-image-consumer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The decide step diffs event.before..sha.
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # Bake's pusher and `crane` both read their auth from
      # ~/.docker/config.json's credential helpers.
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # The `paths:` trigger gate was removed (guarantee-dev-image-per-main-commit)
      # so every push to main runs this workflow. Replicate the former glob set
      # as an in-workflow decision over the pushed range event.before..sha:
      #   * any build-relevant file changed -> build (produces fresh images)
      #   * none changed                     -> inherit the parent tip's digests
      #     so this commit still gets a :<sha> image (byte-identical to parent).
      # Force-push and branch-creation are NOT inheritable and route to build:
      #   * force-push: `github.event.before` is the previous, now-orphaned tip
      #     (a real non-zero SHA, flagged by `github.event.forced == true`) that
      #     is not necessarily an ancestor of the new tip — inheriting its
      #     digest would pin :<sha> to non-equivalent bytes.
      #   * branch creation: `github.event.before` is the zero SHA
      #     (`github.event.created == true`) — no ancestor image exists.
      # An otherwise-unresolvable parent commit also defaults to build (the
      # conservative choice that always produces fresh images).
      # So does a parent with ANY image missing. `concurrency` keeps one run
      # pending per group, and a third push CANCELS the pending one, so a
      # burst of merges (Renovate automerges back to back) leaves a parent
      # commit with no :<before>. Building always yields correct bytes, at the
      # cost of a rebuild of every image.
      #
      # On inherit, the parent digests resolved here are written to
      # $RUNNER_TEMP/parent-digests and copied by the inherit step, so each
      # digest is resolved once. There is deliberately NO fallback to :main or
      # any other tag: :main can point at an older commit whose tree differs
      # from this one, and inheriting it would pin non-equivalent bytes onto
      # :<sha> and silently ship the wrong code to prod.
      - name: Decide build vs inherit
        id: decide
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          FORCED: ${{ github.event.forced }}
          CREATED: ${{ github.event.created }}
          DEV_AR: ${{ env.REGION }}-docker.pkg.dev/liverty-music-dev/backend
        run: |
          set -uo pipefail
          if [ "${FORCED}" = "true" ] || [ "${CREATED}" = "true" ] || [ -z "${BEFORE}" ] || [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Force-push / branch-creation / unresolvable parent (forced=${FORCED} created=${CREATED} before=${BEFORE}) -> build."
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "${BEFORE}" "${SHA}")
          echo "Changed files in ${BEFORE}..${SHA}:"
          echo "${changed}"
          # Build glob set (kept in lock-step with the prior `on.push.paths`):
          # any *.go, go.mod, go.sum, root Dockerfile, the Bake definition, or
          # this workflow file.
          if echo "${changed}" | grep -qE '\.go$|^go\.mod$|^go\.sum$|^Dockerfile$|^docker-bake\.hcl$|^\.github/workflows/deploy\.yml$'; then
            echo "Build-relevant change detected -> build."
            echo "mode=build" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Inherit only when every parent image exists. Auth failures fail
          # fast (a rebuild would hit the same credentials); anything else
          # that stays unresolvable after the retries routes to build.
          digests="${RUNNER_TEMP}/parent-digests"
          : > "${digests}"
          for image in ${IMAGES}; do
            digest=""
            for attempt in $(seq 1 3); do
              rc=0
              body=$(gcloud artifacts docker images describe "${DEV_AR}/${image}:${BEFORE}" \
                --format='value(image_summary.digest)' 2>&1) || rc=$?
              if [ "$rc" -eq 0 ] && [ -n "$body" ]; then digest="$body"; break; fi
              if echo "$body" | grep -qE 'PERMISSION_DENIED|Permission .* denied|HTTPError 403|403 Forbidden|UNAUTHENTICATED|401'; then
                echo "::error::Auth failure resolving ${DEV_AR}/${image}:${BEFORE} (dev AR read). Check the dev build service account's AR read access. stderr: ${body}"
                exit 1
              fi
              if echo "$body" | grep -qE 'NOT_FOUND|not found'; then break; fi
              if [ "$attempt" -lt 3 ]; then
                echo "Attempt ${attempt}/3: ${DEV_AR}/${image}:${BEFORE} not resolvable (${body}); retrying in 20s..."
                sleep 20
              fi
            done
            if [ -z "${digest}" ]; then
              echo "::warning::No build-relevant change, but parent image ${DEV_AR}/${image}:${BEFORE} is missing (its run was cancelled or failed) -> build. Last gcloud output: ${body}"
              echo "mode=build" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "${image} ${digest}" >> "${digests}"
          done
          echo "No build-relevant change and every parent image exists -> inherit parent digests."
          echo "mode=inherit" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.decide.outputs.mode == 'build'
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Go build cache across runs. The Dockerfile's `go build` steps mount
      # /root/.cache/go-build; buildkit-cache-dance copies this directory into
      # that mount before the build and back out after it, and actions/cache
      # persists it. Locally, an edit to one usecase file rebuilt the seven
      # static binaries in 16 s with a warm cache against 122 s cold. Keyed on
      # go.sum: on a hit the cache is not extracted or saved again, so a run
      # pays no upload; a go.sum change (Renovate) starts from the closest
      # older cache and saves a new one.
      - name: Restore the Go build cache
        if: steps.decide.outputs.mode == 'build'
        id: go-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: go-build-cache
          key: deploy-go-build-${{ hashFiles('go.sum') }}
          restore-keys: deploy-go-build-

      - name: Load the Go build cache into BuildKit
        if: steps.decide.outputs.mode == 'build'
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            { "go-build-cache": "/root/.cache/go-build" }
          skip-extraction: ${{ steps.go-build-cache.outputs.cache-hit }}

      # Tags :latest, :main and :<sha> per image (docker-bake.hcl). `source: .`
      # builds the checkout; the action's default is the Git context.
      - name: Build and push every image
        if: steps.decide.outputs.mode == 'build'
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: ./docker-bake.hcl
          push: true
          vars: |
            IMAGE_REPO=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/backend
            SHA=${{ github.sha }}

      - name: Install crane
        if: steps.decide.outputs.mode == 'inherit'
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      # This commit changed nothing build-relevant, so its images are
      # byte-identical to the parent push tip's. Copy each parent digest onto
      # :<sha> (and re-point :main, :latest) — no rebuild. This keeps the
      # "every main commit has a resolvable dev :<sha>" invariant.
      - name: Inherit parent dev AR digests (no rebuild)
        if: steps.decide.outputs.mode == 'inherit'
        env:
          DEV_AR: ${{ env.REGION }}-docker.pkg.dev/liverty-music-dev/backend
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          while read -r image digest; do
            echo "Inheriting ${image}@${digest} onto :${SHA}, :main, :latest."
            crane copy "${DEV_AR}/${image}@${digest}" "${DEV_AR}/${image}:${SHA}"
            crane copy "${DEV_AR}/${image}@${digest}" "${DEV_AR}/${image}:main"
            crane copy "${DEV_AR}/${image}@${digest}" "${DEV_AR}/${image}:latest"
          done < "${RUNNER_TEMP}/parent-digests"

  build-and-push:
    # Defensive guard layer 1 (event filter): only fire on the two supported
    # events. The `target_commitish == 'main'` check is intentionally
    # absent — it's release-creation metadata, not a verified assertion
    # about the tag's underlying commit (see PR #297 review threads
    # 3248512589 / 3248513873). A user could push a tag to a non-main
    # commit and create the release with `--target main`, passing this
    # check while building the non-main commit. The authoritative check
    # is the runtime `Verify release commit on main` step below, which
    # compares `github.sha` against `origin/main` history.
    #
    # The release path only: the push path is `build-dev-images` above.
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    environment:
      # The `prod` environment binds vars.PROJECT_ID=liverty-music-prod /
      # vars.WORKLOAD_IDENTITY_PROVIDER / vars.SERVICE_ACCOUNT scoped to the
      # prod project (managed by Pulumi's GitHubRepositoryComponent — see
      # cloud-provisioning/src/github/).
      name: prod
    permissions:
      contents: read
      id-token: write
    strategy:
      # fail-fast: false so that one matrix entry's failure (e.g. transient
      # AR error during digest-resolve) does NOT cancel the other 8. Partial
      # success is the expected steady state on release events: per the
      # retag runbook, an admin can `gh run rerun --job <job-id>` the
      # single failing matrix entry. The 9 successful entries' prod AR
      # writes are idempotent because `crane copy` to an existing
      # immutable tag at the same digest is a no-op.
      fail-fast: false
      matrix:
        image:
          # api: the shared Connect-RPC API-server image (unify-workload-naming).
          # Built from the `server` Docker target. Named audience-NEUTRAL (`api`,
          # tier only) because the SAME binary backs multiple workloads —
          # `fan-api` and `admin-console-api` — differentiated by runtime config,
          # not code. Both pull this one image (no version drift), mirroring how
          # `consumer` backs the `event-consumer` workload. Successor to the
          # retired `server`/`fan-api` image names.
          - name: api
            target: server
          - name: consumer
            target: consumer
          # identity: the identity service, the only workload that holds the
          # identity-provider credentials.
          - name: identity
            target: identity
          # worker: the workflow worker, the only process that runs durable
          # workflows.
          - name: worker
            target: worker
          - name: concert-discovery
            target: concert-discovery
          - name: artist-image-sync
            target: artist-image-sync
          - name: official-site-refresh
            target: official-site-refresh
          - name: sales-phase-discovery
            target: sales-phase-discovery
          - name: sales-reminders
            target: sales-reminders
          # series-image-consumer: the KEDA scale-to-zero JetStream worker. Its Dockerfile
          # target links libvips (CGO, `-tags vips`) and runs on Alpine, unlike the
          # CGO-off distroless targets, but the build/push/retag path is
          # identical — one more image in the shared `backend` AR repo.
          - name: series-image-consumer
            target: series-image-consumer
    env:
      REGION: ${{ vars.REGION }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      REPOSITORY: ${{ github.event.repository.name }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      SERVICE_ACCOUNT: ${{ vars.SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the ancestry verification has main's history.
          fetch-depth: 0

      # Defensive guard layer 2 (runtime verification): for release events,
      # confirm the checked-out commit (`github.sha`, == the tag's commit)
      # is actually reachable from `origin/main`. Closes the gap where:
      #   * a tag points at a non-main commit, AND
      #   * the release was created with `--target main` (so
      #     `target_commitish` would have falsely passed an event-level
      #     check), OR
      #   * the release was created with `--target <sha>` (where the SHA
      #     happens to be main HEAD but the literal `target_commitish`
      #     string is the SHA, not `"main"`, breaking a string check).
      # See PR #297 review threads 3248512589 (false-negative scenario)
      # and 3248513873 (false-positive scenario).
      - name: Verify release commit is on main
        if: github.event_name == 'release'
        run: |
          git fetch origin main --depth=100
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag at $(git rev-parse HEAD) is not reachable from origin/main ($(git rev-parse origin/main)). Refusing to push prod images. Cut releases on a commit reachable from main — main HEAD is always valid, since every main commit has a resolvable dev image (guarantee-dev-image-per-main-commit)."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      # `crane` reads ~/.docker/config.json's credential helpers for the
      # cross-project prod-AR write.
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Install crane
        if: github.event_name == 'release'
        # SHA-pinned: on the release path this action runs with prod AR
        # credentials, so a hijacked mutable tag would execute code with
        # prod-write authority. SHA of v0.4 verified against
        # https://github.com/imjasonh/setup-crane refs/tags/v0.4.
        uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      # =====================================================================
      # Release path: retag the dev AR digest into prod AR — no rebuild
      # =====================================================================
      # Each matrix entry resolves the dev AR digest for its own
      # `<image>:<sha>` and copies it twice into prod AR under
      # `:<release-tag>` and `:<sha>`. The matrix entries run in parallel;
      # total wall-clock is bounded by the slowest single retag (~30 s).
      #
      # Source and destination FQDNs are written with the literal `backend`
      # repository segment rather than `${{ env.REPOSITORY }}`. Although
      # `REPOSITORY` (== `github.event.repository.name`) happens to equal
      # `backend` today, the dev-AR source is structurally fixed at
      # `liverty-music-dev/backend` regardless of the GitHub repo name —
      # threading it via env would invite a class of bug where renaming
      # the GitHub repo silently breaks the retag pointer. PROJECT_ID
      # is still env-driven because it correctly toggles between
      # `liverty-music-dev` and `liverty-music-prod` via the per-event
      # `environment:` binding above, and we want that toggle.
      - name: Resolve dev AR digest for ${{ matrix.image.name }}:${{ github.sha }}
        if: github.event_name == 'release'
        id: resolve_digest
        env:
          DEV_AR_IMAGE: ${{ env.REGION }}-docker.pkg.dev/liverty-music-dev/backend/${{ matrix.image.name }}
        run: |
          # 6 total attempts (initial + 5 retries) × 60s wait between =
          # ~5-minute total budget. With the "every main commit has a
          # resolvable dev image" invariant (guarantee-dev-image-per-main-commit),
          # a missing :<sha> can only mean the push-path build/inherit job for
          # this commit is still in-flight (release cut seconds after the push)
          # or that job failed — NOT a filtered-out or non-main commit. The
          # retry absorbs the in-flight race; a non-main commit is already
          # rejected by the `Verify release commit is on main` step above.
          #
          # Error classification: gcloud exits non-zero on any failure
          # (NOT_FOUND for missing :<sha>, PERMISSION_DENIED for auth
          # regression, transient 5xx, rate limit, etc.). Treating all
          # failures uniformly as "retry up to 6×" would mask an IAM
          # regression as a 5-minute timeout with a misleading
          # "not found" error. So we capture stderr, classify against
          # the gcloud / AR error vocabulary, and fail fast on auth and
          # other non-NOT_FOUND classes. Only NOT_FOUND-shaped responses
          # consume retry budget.
          stderr_file=$(mktemp)
          for attempt in $(seq 1 6); do
            # rc MUST be reset per iteration: bash leaves rc untouched on
            # a successful command (no `|| rc=$?` trigger), so a stale rc
            # from a prior failed attempt would persist and disqualify a
            # successful resolve in attempt 2..6. Explicit reset before
            # the call, and only the failure branch writes rc.
            rc=0
            digest=$(gcloud artifacts docker images describe \
              "${DEV_AR_IMAGE}:${GITHUB_SHA}" \
              --format='value(image_summary.digest)' \
              2>"$stderr_file") || rc=$?
            if [ "$rc" -eq 0 ] && [ -n "$digest" ]; then
              echo "Resolved digest on attempt ${attempt}/6: $digest"
              echo "digest=$digest" >> "$GITHUB_OUTPUT"
              rm -f "$stderr_file"
              exit 0
            fi
            stderr_body=$(cat "$stderr_file")
            # PERMISSION_DENIED / 403 / forbidden — IAM regression or
            # WIF token misconfig. Retrying for 5 minutes won't help;
            # surface immediately.
            if echo "$stderr_body" | grep -qE 'PERMISSION_DENIED|Permission .* denied|HTTPError 403|403 Forbidden|UNAUTHENTICATED|401'; then
              echo "::error::Auth failure resolving dev AR digest for ${DEV_AR_IMAGE}:${GITHUB_SHA} on attempt ${attempt}/6. The prod CI service account likely lost the cross-project AR reader grant on dev backend AR (resource: prod-ci-backend-ar-reader in cloud-provisioning Pulumi state). Recovery: see docs/runbooks/prod-image-tag-pinning.md retag-failure-recovery in cloud-provisioning."
              echo "::error::gcloud stderr: ${stderr_body}"
              rm -f "$stderr_file"
              exit 1
            fi
            # NOT_FOUND-shaped: the dev :<sha> tag hasn't landed yet — the
            # push-path build/inherit job for this commit is still in-flight
            # (release cut seconds after the push). Retry within the budget.
            if echo "$stderr_body" | grep -qE 'NOT_FOUND|not found|does not exist|tag .* doesn'\''t exist'; then
              if [ "$attempt" -lt 6 ]; then
                echo "Attempt ${attempt}/6: dev AR :sha not yet available; waiting 60s..."
                sleep 60
                continue
              fi
            fi
            # Empty digest with rc==0 OR any other non-zero (transient
            # 5xx, rate limit, network blip) — retry. Echo the stderr
            # so the run log shows what we saw rather than hiding it.
            if [ "$attempt" -lt 6 ]; then
              if [ -n "$stderr_body" ]; then
                echo "Attempt ${attempt}/6: gcloud rc=$rc stderr=${stderr_body}; waiting 60s before retry..."
              else
                echo "Attempt ${attempt}/6: gcloud returned empty digest with rc=$rc; waiting 60s before retry..."
              fi
              sleep 60
            fi
          done
          final_stderr=$(cat "$stderr_file" 2>/dev/null || echo "(no stderr captured)")
          rm -f "$stderr_file"
          echo "::error::dev AR tag :${GITHUB_SHA} not resolved for ${DEV_AR_IMAGE} after 6 attempts (~5 min total wait). Given the every-main-commit-has-an-image invariant, the push-path build/inherit for this commit is still in-flight or failed — do NOT re-target an earlier commit; re-run the push-path 'Deploy Backend' run for this SHA, then re-run this matrix entry. Last gcloud stderr: ${final_stderr}. See docs/runbooks/prod-image-tag-pinning.md retag-failure-recovery in cloud-provisioning."
          exit 1

      # The two `crane copy` calls are bundled into a single step so the
      # workflow's release path presents one "Promote dev AR digest to
      # prod AR" unit rather than two separate steps that could each
      # surface in a partial-success state. Note that this does not
      # change atomicity at the registry layer — `crane copy` is two
      # sequential AR API calls regardless of whether they live in one
      # YAML step or two. If the SHA tag write fails after the semver
      # tag write succeeds, prod AR has only the semver tag; recovery
      # is `gh run rerun --job <job-id>` and the second copy completes
      # (the semver-tag copy is a no-op at the same digest under AR's
      # immutability policy). The runbook
      # docs/runbooks/prod-image-tag-pinning.md "Retag failure recovery"
      # in cloud-provisioning documents this re-run path explicitly.
      - name: Promote dev AR digest to prod AR (semver + sha tags)
        if: github.event_name == 'release'
        env:
          DEV_AR_IMAGE: ${{ env.REGION }}-docker.pkg.dev/liverty-music-dev/backend/${{ matrix.image.name }}
          PROD_AR_IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/backend/${{ matrix.image.name }}
          DIGEST: ${{ steps.resolve_digest.outputs.digest }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          crane copy "${DEV_AR_IMAGE}@${DIGEST}" "${PROD_AR_IMAGE}:${RELEASE_TAG}"
          crane copy "${DEV_AR_IMAGE}@${DIGEST}" "${PROD_AR_IMAGE}:${GITHUB_SHA}"

  # =====================================================================
  # Release path: trigger the automated prod kustomize pin-bump.
  # =====================================================================
  # After ALL 4 retag matrix entries succeed, emit a `repository_dispatch`
  # to cloud-provisioning, which runs `bump-prod-pin.yml` to rewrite the
  # prod overlay pin + version label and push to its own main (ArgoCD then
  # auto-syncs). Per OpenSpec change `automate-prod-pin-bump` (D5): this is a
  # SEPARATE job gated on `build-and-push` succeeding as a whole. With
  # `fail-fast: false`, the matrix job's `result` is `success` ONLY when every
  # one of the 10 entries passed, so a partially-failed retag (e.g. 9/10 images)
  # never bumps the pin to a release tag whose prod images are incomplete
  # (which would ImagePullBackOff in prod).
  #
  # The cross-repo trigger uses a GitHub App installation token (short-lived,
  # auditable) minted at runtime and scoped to cloud-provisioning. The
  # dispatches API requires `Contents: write` (no narrower scope exists), so
  # the security boundary is branch protection: cloud-provisioning:main lets
  # only `github-actions[bot]` bypass, so this token cannot push to the one ref
  # ArgoCD tracks — its reach is bounded to non-`main` refs.
  dispatch-prod-pin:
    needs: [build-and-push]
    if: github.event_name == 'release' && needs.build-and-push.result == 'success'
    runs-on: ubuntu-latest
    # The dispatch uses the GitHub App token minted below, not GITHUB_TOKEN.
    permissions: {}
    # `prod` environment so the dispatch-credential secrets resolve. On a
    # release event the ref is the `vX.Y.Z` tag, which matches the prod
    # environment's `v*` deployment-tag policy.
    environment:
      name: prod
    steps:
      - name: Mint dispatch token (GitHub App, scoped to cloud-provisioning)
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.CI_BOT_APP_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cloud-provisioning

      - name: Dispatch bump-prod-pin to cloud-provisioning
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          payload=$(jq -nc --arg t "$TAG" --arg s "$SHA" \
            '{event_type:"bump-prod-pin",client_payload:{component:"backend",tag:$t,sha:$s}}')
          echo "Dispatching: $payload"
          echo "$payload" | gh api "repos/${OWNER}/cloud-provisioning/dispatches" --input -
