name: CI

# One workflow, one `changes` job and one `CI Success` aggregate. Branch
# protection requires the check named `CI Success`, and it matches by name
# only: when Test, Lint and Atlas CI were three workflows that each published
# a `CI Success`, any one green run satisfied it, and Renovate automerged
# #639 and #641 with failing Lint and Test (#669). Keep exactly one job named
# `CI Success` in this repository.
#
# Path-filtered jobs are skipped, not replaced by placeholder `*-skip` jobs:
# only `CI Success` is required, and `alls-green` treats the jobs listed in
# `allowed-skips` as passing when skipped.
#
# Pull requests are the gate. `main` is not re-checked on every push: from
# 2026-08-21 to 2026-10-21 those runs found no merge that broke `main`, and
# nobody was told when one failed (cloud-provisioning#666). Instead a daily
# run checks `main` with every job, Benchmark included, and opens or updates
# an Issue labelled `ci` when it fails.

on:
  pull_request:
  schedule:
    - cron: "0 19 * * *" # 04:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # Path filters apply to pull requests only. A scheduled or manual run checks
    # the whole of `main`, so every output is true for it.
    outputs:
      src: ${{ github.event_name != 'pull_request' || steps.filter.outputs.src == 'true' }}
      series_image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.series_image == 'true' }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.go == 'true' }}
      schema: ${{ github.event_name != 'pull_request' || steps.filter.outputs.schema == 'true' }}
      atlas: ${{ github.event_name != 'pull_request' || steps.filter.outputs.atlas == 'true' }}
      deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            src:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'k8s/atlas/base/migrations/**'
              - '.github/workflows/**'
            series_image:
              - 'internal/adapter/event/**'
              - 'cmd/consumer/series-image-consumer/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'Makefile'
              - '.github/workflows/**'
            schema:
              - 'internal/infrastructure/database/rdb/schema/schema.sql'
              - 'scripts/lint-schema.sh'
              - '.github/workflows/**'
            atlas:
              - 'k8s/atlas/base/migrations/**'
              - 'k8s/atlas/base/kustomization.yaml'
              - 'scripts/check-migration-drift.sh'
              - 'internal/infrastructure/database/rdb/model.go'
              - 'atlas.hcl'
              - '.github/workflows/**'

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Connect and protocolbuffers schema SDKs are separate modules that
      # Renovate does not manage; fail when they are on different schema builds.
      - name: Check schema SDK modules share one schema commit
        run: scripts/check-schema-sdk-commit.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      # `make lint` installs the golangci-lint version pinned in the Makefile,
      # the same binary local runs and the pre-commit hook use.
      - name: Run make lint
        run: make lint
      # `make check` runs the go fix modernizers, but neither the pre-commit
      # hook nor any other CI job did, so code that `make check` rejects could
      # still merge.
      - name: Check go fix modernizers
        run: make modernize

  schema-lint:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    name: Schema Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run make lint-schema
        run: make lint-schema

  test:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_USER: test-user
          POSTGRES_DB: test-db
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U test-user -d test-db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Setup Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0

      - name: Apply database migrations
        run: atlas migrate apply --url "postgres://test-user@localhost:15432/test-db?sslmode=disable" --dir "file://k8s/atlas/base/migrations"

      - name: Run integration tests
        run: make test-integration GOTEST_FLAGS="-v -coverprofile=coverage.out -covermode=atomic"
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Runs on pull requests that change dependencies and in the daily run. A new
  # advisory can fail any commit, and govulncheck reports only reachable
  # symbols, so new code calling a vulnerable function of an existing
  # dependency is also left to the daily run: at most a day late, for about
  # 1.5 minutes saved on every other pull request.
  vulnerability-check:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          # Pinned so a new release cannot break CI unseen. v1.3.0 (x/tools
          # v0.44.0) and v1.4.0 panic on generics ("ForEachElement called on
          # type containing *types.TypeParam") as soon as a vulnerability is
          # found and the call graph is built; v1.9.0 does not. Renovate bumps it.
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # Compiles and tests the libvips-tagged series image processor
  # (internal/adapter/event/*_vips*.go, `//go:build vips`) through the
  # Dockerfile's `test-series-image-consumer` stage instead of on the bare runner.
  # That stage builds FROM build-series-image-consumer, so it reuses the identical
  # golang builder base + `apk add vips-dev gcc musl-dev pkgconfig` line as
  # the production series-image-consumer image (see Dockerfile) — this guarantees
  # the libvips version under test matches the libvips version that ships
  # in the runtime alpine image. Without this job, series_image_processor_vips.go
  # is compiled and tested by nothing in CI, since it is excluded from the
  # default (non-`vips`-tagged) build everywhere else.
  series-image-consumer-test:
    needs: changes
    if: needs.changes.outputs.series_image == 'true'
    name: Series Image Consumer Test (vips)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # `push: false` and no `load:` -> buildx runs the stage's RUN
      # instructions (go vet + go test) and discards the resulting image;
      # nothing is exported. BUILDKIT_PROGRESS=plain forces `go test -v`
      # output to stream into the step log instead of being buffered
      # behind BuildKit's default terminal UI.
      - name: Build and test series-image-consumer (vips)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          target: test-series-image-consumer
          push: false
          cache-from: type=gha,scope=series-image-consumer-test
          cache-to: type=gha,mode=max,scope=series-image-consumer-test

  benchmark:
    needs: changes
    if: github.event_name != 'pull_request'
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_USER: test-user
          POSTGRES_DB: test-db
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U test-user -d test-db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Setup Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0

      - name: Apply database migrations
        run: atlas migrate apply --url "postgres://test-user@localhost:15432/test-db?sslmode=disable" --dir "file://k8s/atlas/base/migrations"

      # The Makefile and Dockerfile set the same variable; without it
      # `internal/di` panics at init on the zitadel-go / pocketsign
      # extension-number conflict (#669).
      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./...
        env:
          GOLANG_PROTOBUF_REGISTRATION_CONFLICT: ignore

  atlas-ci:
    needs: changes
    if: needs.changes.outputs.atlas == 'true' && github.event_name == 'pull_request'
    name: Atlas CI
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgres://postgres:password@localhost:15432/postgres?sslmode=disable"
    services:
      postgres:
        image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0

      - name: Check Migration Ordering
        run: bash scripts/check-migration-drift.sh --check-ordering

      - name: Atlas Migrate Validate
        run: |
          atlas migrate validate \
            --dev-url "${{ env.DATABASE_URL }}" \
            --dir "file://k8s/atlas/base/migrations"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        lint,
        schema-lint,
        test,
        vulnerability-check,
        series-image-consumer-test,
        benchmark,
        atlas-ci,
      ]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: lint, schema-lint, test, vulnerability-check, series-image-consumer-test, benchmark, atlas-ci
          jobs: ${{ toJSON(needs) }}

  # Without this a failure on `main` reaches nobody: Benchmark failed on every
  # `main` push for 11 days before #669.
  report-main-failure:
    name: Report main failure
    needs: ci-success
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the main CI failure Issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="CI failing on main"
          body="The daily CI run on \`main\` (${GITHUB_SHA::8}) failed: ${RUN_URL}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ci --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label ci --label bug --title "$title" --body "$body"
          fi
