name: CI

# One workflow, one `changes` job and one `CI Success` aggregate. Branch
# protection requires the check named `CI Success`, and it matches by name
# only: when Test, Lint and Atlas CI were three workflows that each published
# a `CI Success`, any one green run satisfied it, and Renovate automerged
# #639 and #641 with failing Lint and Test (#669). Keep exactly one job named
# `CI Success` in this repository.
#
# Lint and Test run on every pull request, with no path filter. A path
# allow-list has to name every file the checks read, and it did not: the
# Makefile, scripts/, testdata/ and the templates embedded in the binary were
# missing, so #852 (Makefile and scripts/test-postgres.sh only) merged with
# Test skipped and `CI Success` green. The filter saved almost nothing: 1 of the
# last 80 merged pull requests skipped Test, and that one was #852.
#
# Only jobs with a narrow, known set of inputs keep a path filter: Schema Lint,
# Atlas CI, Vulnerability Check and the vips Series Image Consumer Test.
# Benchmark runs only in the daily run. Skipped jobs are not replaced by
# placeholder `*-skip` jobs: only `CI Success` is required, and `alls-green`
# treats the jobs listed in `allowed-skips` as passing when skipped. The daily
# run on `main` runs every job, so a file a filter misses is caught within a
# day.
#
# Pull requests are the gate. `main` is not re-checked on every push: from
# 2026-08-21 to 2026-10-21 those runs found no merge that broke `main`, and
# nobody was told when one failed (cloud-provisioning#666). Instead a daily
# run checks `main` with every job, Benchmark included; report-main-ci opens
# an Issue labelled `ci` when it fails and closes it when it passes.

on:
  pull_request:
  schedule:
    - cron: "17 19 * * *" # 04:17 JST; off minute 0, where GitHub delays and drops scheduled runs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    # Path filters apply to pull requests only. A scheduled or manual run checks
    # the whole of `main`, so every output is true for it.
    outputs:
      series_image: ${{ github.event_name != 'pull_request' || steps.filter.outputs.series_image == 'true' }}
      schema: ${{ github.event_name != 'pull_request' || steps.filter.outputs.schema == 'true' }}
      atlas: ${{ github.event_name != 'pull_request' || steps.filter.outputs.atlas == 'true' }}
      deps: ${{ github.event_name != 'pull_request' || steps.filter.outputs.deps == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            deps:
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
            # Only the vips-tagged files: the rest of the package is tested by
            # Test, and the scheduled run tests everything with vips.
            series_image:
              - 'internal/adapter/event/series_image*'
              - 'cmd/consumer/series-image-consumer/**'
              - 'go.mod'
              - 'go.sum'
              - 'Dockerfile'
              - '.github/workflows/ci.yml'
            schema:
              - 'internal/infrastructure/database/rdb/schema/schema.sql'
              - 'scripts/lint-schema.sh'
              - '.github/workflows/**'
            atlas:
              - 'k8s/atlas/base/migrations/**'
              - 'k8s/atlas/base/reference-data/**'
              - 'k8s/atlas/base/kustomization.yaml'
              - 'scripts/check-migration-drift.sh'
              - 'internal/infrastructure/database/rdb/model.go'
              - 'atlas.hcl'
              - '.github/workflows/**'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Connect and protocolbuffers schema SDKs are separate modules that
      # Renovate does not manage; fail when they are on different schema builds.
      - name: Check schema SDK modules share one schema commit
        run: scripts/check-schema-sdk-commit.sh
      # Lint keeps its own caches, saved only by the daily run on `main` (the
      # Test job does the same, with its own key). With setup-go's `cache: true`
      # the first job to finish saved the shared key, and every pull request
      # saved a 560 MB copy that no other pull request can read. go vet,
      # golangci-lint and go fix compile the whole module: 118 s of the 190 s
      # median on a clean cache. Run again on a warm cache they take 2 s, 2 s
      # and 2 s, and 13 s for golangci-lint after a change (4 CPUs, measured
      # locally; golangci-lint's own cache alone saves 61 s to 19 s).
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Find the Go cache directories
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go and golangci-lint caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
            ~/.cache/golangci-lint
          # The key never matches: the newest cache with the prefix is restored.
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-lint-${{ runner.os }}-
      # `make lint` installs the golangci-lint version pinned in the Makefile,
      # the same binary local runs and the pre-commit hook use.
      - name: Run make lint
        run: make lint
      # `make check` runs the go fix modernizers, but neither the pre-commit
      # hook nor any other CI job did, so code that `make check` rejects could
      # still merge.
      - name: Check go fix modernizers
        run: make modernize

      - name: Save the Go and golangci-lint caches
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
            ~/.cache/golangci-lint
          key: go-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

  schema-lint:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    name: Schema Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run make lint-schema
        run: make lint-schema

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        # Throwaway test database: durability is traded for speed (PostgreSQL
        # docs, "Non-Durable Settings"), and max_connections is raised for the
        # tests that each connect to a database of their own. Same settings as
        # compose.yml.
        command: -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=300
        env:
          POSTGRES_USER: test-user
          POSTGRES_DB: test-db
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U test-user -d test-db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Test keeps its own Go caches instead of setup-go's `cache: true`. Lint
      # used the same setup-go key and the first job to finish saved it, so
      # the cache held Lint's builds, not the `-race` test builds: Test took
      # 323 s when it restored the cache and 295 s when it did not. Compiling
      # the tests clean takes 216 s and 67 s from a cache that holds them
      # (4 CPUs, measured locally).
      #
      # Only the daily run on `main` saves. A pull request's cache is readable
      # by no other pull request, and saving 560 MB per pull request filled the
      # repository's 10 GB cache quota (9.76 GB on 2026-11-15), which evicts
      # the caches that do help. Pull requests restore the newest `main` cache
      # and compile only what they changed.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Find the Go cache directories
        id: gocache
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

      - name: Restore the Go caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          # The key never matches: the newest cache with the prefix is restored.
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-
            go-test-${{ runner.os }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # The database tests apply the migrations themselves: each test gets a
      # copy of a template database built with the atlas CLI
      # (internal/testutil/database.go), so atlas must be on PATH.
      - name: Setup Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0

      - name: Run integration tests
        run: make test-integration GOTEST_FLAGS="-v -coverprofile=coverage.out -covermode=atomic"
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}

      - name: Save the Go caches
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ${{ steps.gocache.outputs.build }}
            ${{ steps.gocache.outputs.mod }}
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Runs on pull requests that change dependencies and in the daily run. A new
  # advisory can fail any commit, and govulncheck reports only reachable
  # symbols, so new code calling a vulnerable function of an existing
  # dependency is also left to the daily run: at most a day late, for about
  # 1.5 minutes saved on every other pull request.
  vulnerability-check:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    name: Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          # Pinned so a new release cannot break CI unseen. v1.3.0 (x/tools
          # v0.44.0) and v1.4.0 panic on generics ("ForEachElement called on
          # type containing *types.TypeParam") as soon as a vulnerability is
          # found and the call graph is built; v1.9.0 does not. Renovate bumps it.
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  # Compiles and tests the libvips-tagged series image processor
  # (internal/adapter/event/*_vips*.go, `//go:build vips`) through the
  # Dockerfile's `test-series-image-consumer` stage instead of on the bare runner.
  # That stage builds FROM vips-builder, the stage the production build also starts
  # from, so it uses the identical
  # golang builder base + `apk add vips-dev gcc musl-dev pkgconfig` line as
  # the production series-image-consumer image (see Dockerfile) — this guarantees
  # the libvips version under test matches the libvips version that ships
  # in the runtime alpine image. Without this job, series_image_processor_vips.go
  # is compiled and tested by nothing in CI, since it is excluded from the
  # default (non-`vips`-tagged) build everywhere else.
  series-image-consumer-test:
    needs: changes
    if: needs.changes.outputs.series_image == 'true'
    name: Series Image Consumer Test (vips)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # `push: false` and no `load:` -> buildx runs the stage's RUN
      # instructions (go vet + go test) and discards the resulting image;
      # nothing is exported. BUILDKIT_PROGRESS=plain forces `go test -v`
      # output to stream into the step log instead of being buffered
      # behind BuildKit's default terminal UI.
      - name: Build and test series-image-consumer (vips)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          target: test-series-image-consumer
          push: false
          cache-from: type=gha,scope=series-image-consumer-test
          # Written by the daily run on main only. A pull request's cache is
          # readable by no other pull request, and exporting it took 60 s of
          # every run of this job.
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max,scope=series-image-consumer-test' || '' }}

  benchmark:
    needs: changes
    if: github.event_name != 'pull_request'
    name: Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_USER: test-user
          POSTGRES_DB: test-db
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U test-user -d test-db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Setup Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0

      # search_path=app as the Atlas Operator applies them in production, so
      # every table lands in app (#769).
      - name: Apply database migrations
        run: |
          atlas migrate apply --url "postgres://test-user@localhost:15432/test-db?sslmode=disable&search_path=app" --dir "file://k8s/atlas/base/migrations"
          # The reference data, as the backend-reference-data AtlasMigration
          # applies it (k8s/atlas/base/reference-data-migration.yaml).
          atlas migrate apply --url "postgres://test-user@localhost:15432/test-db?sslmode=disable" --dir "file://k8s/atlas/base/reference-data" \
            --revisions-schema atlas_reference_data --baseline 20261124120000

      # The Makefile and Dockerfile set the same variable; without it
      # `internal/di` panics at init on the zitadel-go / pocketsign
      # extension-number conflict (#669).
      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./...
        env:
          GOLANG_PROTOBUF_REGISTRATION_CONFLICT: ignore

  atlas-ci:
    needs: changes
    if: needs.changes.outputs.atlas == 'true' && github.event_name == 'pull_request'
    name: Atlas CI
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgres://postgres:password@localhost:15432/postgres?sslmode=disable"
    services:
      postgres:
        image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 15432:5432

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Atlas
        uses: ariga/setup-atlas@2f3c785c89a15e1c0d07bcae3900fb5feb969eea # v0

      - name: Check Migration Ordering
        run: bash scripts/check-migration-drift.sh --check-ordering

      - name: Atlas Migrate Validate
        run: |
          atlas migrate validate \
            --dev-url "${{ env.DATABASE_URL }}" \
            --dir "file://k8s/atlas/base/migrations"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs:
      [
        changes,
        lint,
        schema-lint,
        test,
        vulnerability-check,
        series-image-consumer-test,
        benchmark,
        atlas-ci,
      ]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: schema-lint, vulnerability-check, series-image-consumer-test, benchmark, atlas-ci
          jobs: ${{ toJSON(needs) }}

  # Keeps the Issue "CI failing on main" in step with this nightly run: a
  # failure opens it or comments, a green run closes it. A new Issue starts
  # the Claude routine that triages the failure (liverty-music/.github
  # routines/fix-main-ci.md).
  report-main-ci:
    name: Report main CI
    needs: ci-success
    if: always() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: liverty-music/.github/.github/workflows/report-main-ci.yml@main
    with:
      result: ${{ needs.ci-success.result }}
