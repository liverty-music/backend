name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      schema: ${{ steps.filter.outputs.schema }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.mise.toml'
              - 'Makefile'
              - '.github/workflows/**'
            schema:
              - 'internal/infrastructure/database/rdb/schema/schema.sql'
              - 'scripts/lint-schema.sh'
              - '.github/workflows/**'

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The Connect and protocolbuffers schema SDKs are separate modules that
      # Renovate does not manage; fail when they are on different schema builds.
      - name: Check schema SDK modules share one schema commit
        run: scripts/check-schema-sdk-commit.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      # Version comes from .mise.toml, the single pin shared with local runs
      # and the pre-commit hook, and the one Renovate updates (mise manager).
      - name: Read golangci-lint version
        id: golangci-lint
        run: |
          set -euo pipefail
          version="$(sed -n 's/^golangci-lint = "\(.*\)"$/\1/p' .mise.toml)"
          test -n "$version"
          echo "version=v${version}" >> "$GITHUB_OUTPUT"
      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: ${{ steps.golangci-lint.outputs.version }}
          install-only: true
      - name: Run make lint
        run: make lint
      # `make check` runs the go fix modernizers, but neither the pre-commit
      # hook nor any other CI job did, so code that `make check` rejects could
      # still merge.
      - name: Check go fix modernizers
        run: make modernize

  lint-skip:
    needs: changes
    if: needs.changes.outputs.go == 'false'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping lint"

  schema-lint:
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    name: Schema Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run make lint-schema
        run: make lint-schema

  schema-lint-skip:
    needs: changes
    if: needs.changes.outputs.schema == 'false'
    name: Schema Lint
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant changes, skipping schema lint"

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [changes, lint, lint-skip, schema-lint, schema-lint-skip]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: lint, lint-skip, schema-lint, schema-lint-skip
          jobs: ${{ toJSON(needs) }}
