name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Skip review on generated / machine-managed files to cut review noise.
    paths-ignore:
      - '**/mocks/**'
      - 'k8s/atlas/**/migrations/**'
      - '**/oss-licenses.json'

# Permissions are inherited by the reusable workflow's job and intersected
# with its own workflow-level declarations. Set them here in the caller so
# the called job has everything it needs (inline comments, Claude action OIDC).
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: liverty-music/.github/.github/workflows/claude-review.yml@main
    secrets: inherit
