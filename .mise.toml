[tools]
# The single golangci-lint version for local runs, the pre-commit hook and CI
# (.github/workflows/lint.yml reads it from here). Renovate's mise manager
# updates it. Pinned, not "latest", so an update is always a reviewed PR.
#
# Installed as the official release binary, as golangci-lint's install guide
# recommends (https://golangci-lint.run/welcome/install/). It is deliberately
# not a go.mod `tool`: building it from source would merge its dependency graph
# into ours.
golangci-lint = "2.14.0"
