# Applies the reference data directory (reference-data/: areas, time zones and
# regions generated by scripts/areas) after the schema migrations. It is a
# second AtlasMigration because the seed does not fit the schema migrations'
# ConfigMap (1 MiB). Atlas keeps one history table per directory, so this one
# connects database-scoped and keeps its history in its own schema
# (revisionsSchema); its files set search_path to app themselves. The first
# file is an empty baseline: the schema migrations have already created the
# tables, so the database is not empty when this directory first runs.
apiVersion: db.atlasgo.io/v1alpha1
kind: AtlasMigration
metadata:
  name: backend-reference-data
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  credentials:
    scheme: postgres
    host: REPLACE_BY_OVERLAY
    port: 5432
    user: postgres
    passwordFrom:
      secretKeyRef:
        name: atlas-db-credentials
        key: postgres-admin-password
    database: liverty-music
    parameters:
      sslmode: require
  revisionsSchema: atlas_reference_data
  baseline: "20261124120000"
  dir:
    configMapRef:
      name: atlas-reference-data-dir
