name: liverty-music-backend

services:
  postgres:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    container_name: postgres
    network_mode: host
    # Test database: durability is traded for speed (PostgreSQL docs, "Non-Durable
    # Settings"). An abrupt OS crash can corrupt the cluster; recreate the volume
    # then (docker compose down -v) and re-apply the migrations.
    command: ["postgres", "-p", "15432", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    environment:
      POSTGRES_USER: test-user
      POSTGRES_DB: test-db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test-user -d test-db -p 15432"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    container_name: server
    env_file:
      - .env.test
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
